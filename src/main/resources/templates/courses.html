<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Courses</title></head>
<body>
<h3>Courses</h3>
<table border="1">
    <tr><th>ID</th><th>Title</th><th>Description</th><th>TeacherId</th></tr>
    <tr th:each="c: ${courses}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.title}"></td>
        <td th:text="${c.description}"></td>
        <td th:text="${c.teacherId}"></td>
    </tr>
</table>
<hr/>
<h4>Add course (TEACHER only)</h4>
<form method="post" action="/courses">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input name="title" placeholder="Title"/>
    <input name="description" placeholder="Description"/>
    <input name="teacherId" placeholder="TeacherId"/>
    <button type="submit">Save</button>
</form>
<p><a href="/">Home</a></p>
<form method="post" action="/logout">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <button type="submit">Logout</button>
</form>
</body>
</html>
