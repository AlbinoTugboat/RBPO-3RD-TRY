name: CI Pipeline with SAST

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# Разрешения для загрузки security-отчетов
permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Убираем SSH ключ для проверки
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean test package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: target-jars
          path: target/*.jar
          retention-days: 7

  semgrep-sast:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SAST Scan
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-report.sarif \
            --error \
            --metrics=off

      - name: Verify SARIF report exists
        run: |
          if [ -f "semgrep-report.sarif" ]; then
            echo "✅ Файл отчёта успешно создан."
            echo "Размер файла: $(wc -l < semgrep-report.sarif) строк"
            # Проверяем содержимое
            head -20 semgrep-report.sarif
          else
            echo "❌ ОШИБКА: файл semgrep-report.sarif не найден."
            ls -la
            exit 1
          fi

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-report.sarif
          # Добавляем token для безопасности
          token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-processing: false