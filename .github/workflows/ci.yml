name: CI Pipeline

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean test package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-jars
          path: target/*.jar
          retention-days: 7

  sast:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep CE and create SARIF
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src \
            returntocorp/semgrep:latest \
            semgrep scan --config p/default --sarif --output semgrep.sarif --metrics=off .

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  sca:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compute dependency-check cache epoch
        id: odc-epoch
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore dependency-check DB cache
        id: odc-cache
        uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: ${{ runner.os }}-odc-db-${{ steps.odc-epoch.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-odc-db-

      - name: Configure optional NVD API key
        shell: bash
        run: |
          key="${{ secrets.NVD_API_KEY }}"
          if [[ -z "$key" ]]; then
            echo "NVD_API_KEY is not configured, using unauthenticated NVD access."
          elif [[ "$key" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]]; then
            echo "NVD_API_KEY=$key" >> "$GITHUB_ENV"
            echo "NVD API key looks valid."
          else
            echo "::warning::NVD_API_KEY has unexpected format, ignoring it for this run."
          fi

      - name: Warm dependency-check DB on cache miss
        id: odc-warm
        if: steps.odc-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests dependency-check:update-only

      - name: Warm dependency-check DB without API key (fallback)
        id: odc-warm-no-key
        if: steps.odc-cache.outputs.cache-hit != 'true' && steps.odc-warm.outcome == 'failure'
        env:
          NVD_API_KEY: ""
        continue-on-error: true
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests dependency-check:update-only

      - name: Run OWASP Dependency-Check (fast mode)
        if: steps.odc-cache.outputs.cache-hit == 'true' || steps.odc-warm.outcome == 'success' || steps.odc-warm-no-key.outcome == 'success'
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests -DautoUpdate=false dependency-check:check

      - name: Run OWASP Dependency-Check (last-resort full update)
        if: steps.odc-cache.outputs.cache-hit != 'true' && steps.odc-warm.outcome == 'failure' && steps.odc-warm-no-key.outcome == 'failure'
        env:
          NVD_API_KEY: ""
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests -DautoUpdate=true dependency-check:check

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 7

  dast_baseline:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: target-jars
          path: target

      - name: Prepare ZAP rules
        run: |
          mkdir -p .zap
          touch .zap/rules.tsv
          touch zap.yaml
          chmod a+w "$GITHUB_WORKSPACE" zap.yaml

      - name: Start application in background
        run: |
          java -jar target/*.jar > app-baseline.log 2>&1 &
          sleep 30

      - name: Run ZAP baseline scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8080"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"
          allow_issue_writing: false
          artifact_name: "zap-scan-baseline"

      - name: Normalize baseline report filenames
        if: always()
        run: |
          [ -f report_html.html ] && cp report_html.html zap-baseline-report.html || true
          [ -f report_json.json ] && cp report_json.json zap-baseline-report.json || true
          [ -f report_md.md ] && cp report_md.md zap-baseline-report.md || true

      - name: Upload baseline DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            zap-baseline-report.html
            zap-baseline-report.json
            zap-baseline-report.md
            app-baseline.log
          retention-days: 7

  dast_api:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: target-jars
          path: target

      - name: Prepare ZAP rules
        run: |
          mkdir -p .zap
          touch .zap/rules.tsv
          touch zap.yaml
          chmod a+w "$GITHUB_WORKSPACE" zap.yaml

      - name: Start application in background
        run: |
          java -jar target/*.jar > app-api.log 2>&1 &
          sleep 30

      - name: Run ZAP API scan
        continue-on-error: true
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: ".zap/openapi.yaml"
          format: "openapi"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"
          allow_issue_writing: false
          artifact_name: "zap-scan-api"

      - name: Normalize API report filenames
        if: always()
        run: |
          [ -f report_html.html ] && cp report_html.html zap-api-report.html || true
          [ -f report_json.json ] && cp report_json.json zap-api-report.json || true
          [ -f report_md.md ] && cp report_md.md zap-api-report.md || true

      - name: Upload API DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-report
          path: |
            zap-api-report.html
            zap-api-report.json
            zap-api-report.md
            app-api.log
          retention-days: 7
