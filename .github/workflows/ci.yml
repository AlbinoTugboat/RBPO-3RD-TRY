name: CI Pipeline with SAST

on:
  pull_request:
    branches: [ main ]

# Разрешения для загрузки security-отчетов
permissions:
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean test package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: target-jars
          path: target/*.jar
          retention-days: 7

  semgrep-sast:
    # Запускается ТОЛЬКО после успешной сборки
    needs: build
    runs-on: ubuntu-latest
    # Наследуем разрешения от workflow
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          outputFormat: sarif
          outputFile: semgrep-report.sarif

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-report.sarif