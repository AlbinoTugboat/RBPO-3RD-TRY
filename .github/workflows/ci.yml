name: CI Pipeline with SAST

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

  semgrep-sast:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      # Вариант 1: Использовать конкретные правила вместо auto (рекомендуется)
      - name: Run Semgrep SAST Scan
        run: |
          # Для Java проекта используем правила безопасности Java
          semgrep scan \
            --config "p/security-audit" \
            --sarif \
            --output semgrep-report.sarif \
            --error

      # ИЛИ Вариант 2: Использовать auto с метриками (проще)
      # - name: Run Semgrep SAST Scan
      #   run: |
      #     semgrep scan \
      #       --config auto \
      #       --sarif \
      #       --output semgrep-report.sarif \
      #       --error

      - name: Verify SARIF report exists
        run: |
          if [ -f "semgrep-report.sarif" ]; then
            echo "✅ Файл отчёта успешно создан."
            echo "Размер файла: $(wc -l < semgrep-report.sarif) строк"
          else
            echo "❌ ОШИБКА: файл semgrep-report.sarif не найден."
            ls -la
            exit 1
          fi

      - name: Upload SARIF results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-report.sarif