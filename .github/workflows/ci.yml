name: CI Pipeline with SAST

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

  sast-scan:
    name: SAST Analysis
    needs: build
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest

    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p reports
      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config "p/java" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --sarif \
            --output reports/semgrep-results.sarif || true
      - name: Save reports
        uses: github/codeql-action/upload-sarif@v4
        with:
          name: reports-semgrep
          sarif_file: reports/semgrep-results.sarif
          retention-days: 14

  dependency-check:
    name: OWASP Dependency Check (SCA)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DautoUpdate=false\
            -DnvdApiKey=f9e6f963-0f6f-451f-be90-d3083f591571 \
            -Dformat=HTML \
            -DsuppressionFiles=dependency-check-suppressions.xml \
            -DfailOnError=false

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 14

