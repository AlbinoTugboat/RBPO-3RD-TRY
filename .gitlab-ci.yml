workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'

stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  ODC_DATA_DIR: "$CI_PROJECT_DIR/.dependency-check-data"

cache:
  paths:
    - .m2/repository/
    - target/
    - .dependency-check-data/

build:
  stage: build
  tags:
    - sass-linux-small-amd64  # Ваш собственный раннер
  image: eclipse-temurin:21-jdk
  before_script:
    # Устанавливаем Maven вручную для образа с только JDK
    - apt-get update && apt-get install -y maven
  script:
    - chmod +x ./mvnw
    - ./mvnw clean test package
  artifacts:
    paths:
      - ./target/*.jar
    expire_in: 1 week

semgrep_sast:
  stage: test
  image: returntocorp/semgrep:latest
  needs:
    - build
  script:
    - semgrep scan --config .semgrep/gitlab-rules.yml --gitlab-sast --output gl-sast-report.json --metrics=off .
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 1 week

dependency_check_sca:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  needs:
    - build
  cache:
    key: dependency-check-db
    paths:
      - .m2/repository/
      - .dependency-check-data/
    policy: pull-push
  script:
    - chmod +x ./mvnw
    - |
      if [ -f "$ODC_DATA_DIR/odc.mv.db" ] || [ -f "$ODC_DATA_DIR/odc.script" ]; then
        echo "Dependency-Check DB cache found, running fast scan without update."
        ./mvnw -B -DskipTests -DautoUpdate=false dependency-check:check
      else
        echo "Dependency-Check DB cache not found, warming cache and running scan."
        ./mvnw -B -DskipTests dependency-check:update-only dependency-check:check
      fi
  artifacts:
    when: always
    paths:
      - target/dependency-check-report.html
    expire_in: 1 week

dast_baseline:
  stage: test
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
  script:
    - java -jar target/*.jar > app-baseline.log 2>&1 &
    - sleep 30
    - zap-baseline.py -t http://127.0.0.1:8080 -c .zap/rules.tsv -r zap-baseline-report.html -J zap-baseline-report.json -w zap-baseline-report.md -I || true
  artifacts:
    when: always
    paths:
      - zap-baseline-report.html
      - zap-baseline-report.json
      - zap-baseline-report.md
      - app-baseline.log
    expire_in: 1 week

dast_api:
  stage: test
  image:
    name: zaproxy/zap-stable
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
  script:
    - java -jar target/*.jar > app-api.log 2>&1 &
    - sleep 30
    - zap-api-scan.py -f openapi -t .zap/openapi.yaml -c .zap/rules.tsv -r zap-api-report.html -J zap-api-report.json -w zap-api-report.md -I || true
  artifacts:
    when: always
    paths:
      - zap-api-report.html
      - zap-api-report.json
      - zap-api-report.md
      - app-api.log
    expire_in: 1 week
